events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Backend upstream
    upstream backend {
        server backend:8000;
    }

    # Frontend upstream (Vite Dev Server)
    upstream frontend {
        server frontend:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Frontend Proxy (Root)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Proxy (/api)
        location /api/ {
            proxy_pass http://backend/api/; # Trailing slash is important to strip /api prefix if backend doesn't expect it
            # Actually, my backend expects /api prefix in the router configuration? 
            # Let's check main.py. 
            # app.include_router(auth.router, prefix="/api")
            # So if I request https://localhost/api/auth/login
            # nginx receives /api/auth/login
            # if I proxy_pass http://backend/api/
            # it might double the api or strip it depending on nginx behavior.
            # If I use proxy_pass http://backend; it passes /api/auth/login.
            # My backend is mounted on /api prefix.
            # So I should pass the full path.
            
            # Correction: 
            # In main.py: app.include_router(..., prefix="/api")
            # So backend expects /api/auth/login.
            # So `proxy_pass http://backend;` keeps the URI as is.
        }
        
        # Correction on the location block above
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

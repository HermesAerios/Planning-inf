events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
        # In production, frontend is usually a static build served by nginx itself
        # But here we stick to the container if it serves static, or we map the build volume.
        # Ideally: build frontend, mount dist/ to /usr/share/nginx/html, and serve static.
        # But keeping it simple for now: valid proxy or serve static.
        # Let's assume frontend container runs a static server or node server.
        # If frontend build produces static files, we should serve them directly from nginx for performance.
        # I'll stick to proxying for minimal changes, but proper way is serving static.
    }

    server {
        listen 80;
        server_name $DOMAIN_NAME;
        server_tokens off;

        # ACME Challenge for Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name $DOMAIN_NAME;
        server_tokens off;

        ssl_certificate /etc/letsencrypt/live/$DOMAIN_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/$DOMAIN_NAME/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Formatting options
        client_max_body_size 10M;

        # Frontend (Root)
        location / {
            proxy_pass http://frontend; # Or serve static files if volume mapped
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        }

        # Backend (/api)
        location /api {
            proxy_pass http://backend;
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
        }
    }
}
